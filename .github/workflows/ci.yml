name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  rust:
    name: Build, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The runner already has Rust; only the lint components are missing.
      - name: Toolchain components
        run: rustup component add rustfmt clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      # Tests build their own throwaway databases and import the reference tenant fixture,
      # so this also proves the migration and the catalog import work on a clean machine.
      - name: Test
        run: cargo test
