[package]
name = "rustpos"
version = "0.1.0"
edition = "2021"
description = "RustPOS — self-hosted point of sale with a raw-material stock ledger, in one binary"
publish = false

[dependencies]
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
