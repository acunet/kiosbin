[package]
name = "kiosbin"
version = "0.1.0"
edition = "2021"
description = "Kiosbin — self-hosted point of sale with a raw-material stock ledger, in one binary"
publish = false

[dependencies]
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8.9"
askama = "0.16.1"
tower-sessions = "0.15.0"
sha2 = "0.11.1"

[profile.release]
strip = true

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
