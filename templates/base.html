<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kiosbin{% endblock %}</title>
  <script src="/assets/htmx.min.js" defer></script>
  <style>
    :root {
      --ink: #17202a;
      --muted: #6b7a8d;
      --line: #d8dee6;
      --card: #ffffff;
      --page: #f2f5f8;
      --accent: #1f7a5a;
      --accent-ink: #ffffff;
      --warn: #b8402c;
      --warn-soft: #fdecea;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: var(--page);
    }
    header.top {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 16px; background: var(--card);
      border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5;
    }
    header.top .brand { font-weight: 700; font-size: 18px; }
    header.top .meta { color: var(--muted); font-size: 14px; }
    header.top .spacer { flex: 1; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 48px; padding: 0 16px; border-radius: 10px;
      border: 1px solid var(--line); background: var(--card); color: var(--ink);
      font-size: 16px; font-weight: 600; cursor: pointer; text-decoration: none;
    }
    .btn:hover { border-color: var(--muted); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .btn.danger { color: var(--warn); border-color: #e7b7ae; }
    .btn.wide { width: 100%; }
    .btn.tile { min-height: 84px; flex-direction: column; align-items: flex-start; padding: 10px 12px; }
    .btn.tile .code { font-size: 12px; color: var(--muted); font-weight: 500; }
    .btn.tile .price { margin-top: auto; font-weight: 700; }
    .btn.tile.noprice { border-color: #e7b7ae; background: var(--warn-soft); }
    .layout { display: grid; grid-template-columns: 1fr 380px; gap: 16px; padding: 16px; align-items: start; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
    .panel h2 { margin: 0 0 10px; font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    input[type=text], input[type=password], input[type=number], select {
      min-height: 48px; padding: 8px 12px; font-size: 16px;
      border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); width: 100%;
    }
    label { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
    .tab { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); cursor: pointer; text-decoration: none; color: var(--ink); font-size: 14px; }
    .tab.active { background: var(--ink); color: #fff; border-color: var(--ink); }
    .lines { list-style: none; margin: 0; padding: 0; }
    .lines li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
    .lines .name { flex: 1; font-weight: 600; }
    .lines .qty { color: var(--muted); font-variant-numeric: tabular-nums; }
    .lines .amount { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 88px; text-align: right; }
    .qtybtn { min-width: 44px; min-height: 44px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-size: 18px; cursor: pointer; }
    .totals { display: flex; align-items: baseline; justify-content: space-between; margin: 12px 0; font-size: 20px; font-weight: 700; }
    .flash { margin: 12px 16px 0; padding: 12px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); border: 1px solid #e7b7ae; font-weight: 600; }
    .hint { color: var(--muted); font-size: 14px; }
    .big { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }
    pre.paper { background: #10151c; color: #e8eef6; padding: 14px; border-radius: 10px; overflow-x: auto; font: 13px/1.35 "Cascadia Mono", Consolas, monospace; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .ok { color: var(--accent); font-weight: 700; }
    .bad { color: var(--warn); font-weight: 700; }
    .center { max-width: 560px; margin: 40px auto; padding: 0 16px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .row > * { flex: 1; }
  </style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
