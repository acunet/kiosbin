<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kiosbin{% endblock %}</title>
  <script src="/assets/htmx.min.js" defer></script>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --line: #e5e9f0;
      --line-strong: #d5dce6;
      --ink: #0f172a;
      --muted: #64748b;
      --faint: #94a3b8;
      --brand: #0b7ce6;
      --brand-dark: #0968c2;
      --brand-soft: #e8f3fe;
      --ok: #15803d;
      --ok-soft: #e7f8ee;
      --warn: #b45309;
      --warn-soft: #fff4e5;
      --bad: #dc2626;
      --bad-soft: #fdeceb;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, .06);
      --shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 10px 28px -18px rgba(15, 23, 42, .35);
      --rail: 68px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font: 15px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3 { margin: 0; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; }
    .tnum { font-variant-numeric: tabular-nums; }

    /* ---------- shell: icon rail + main ---------- */
    .app { display: grid; grid-template-columns: var(--rail) 1fr; min-height: 100vh; }
    .rail {
      background: var(--surface); border-right: 1px solid var(--line);
      display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 8px;
      position: sticky; top: 0; height: 100vh;
    }
    .rail .mark {
      width: 40px; height: 40px; border-radius: 12px; margin-bottom: 10px;
      background: linear-gradient(140deg, var(--brand), #4aa3ff);
      color: #fff; font-weight: 800; font-size: 18px;
      display: grid; place-items: center; box-shadow: var(--shadow-sm);
    }
    .rail a, .rail button.rail-btn {
      width: 46px; height: 42px; border: 0; background: transparent; border-radius: 12px;
      display: grid; place-items: center; color: var(--muted); cursor: pointer;
    }
    .rail a:hover, .rail button.rail-btn:hover { background: var(--surface-2); color: var(--ink); }
    .rail a.active { background: var(--brand-soft); color: var(--brand); }
    .rail .gap { height: 8px; }
    .rail .spacer { flex: 1; }
    .rail .bottom { border-top: 1px solid var(--line); padding-top: 10px; width: 38px; display: grid; justify-items: center; }
    .rail svg { width: 22px; height: 22px; stroke-width: 1.8; }

    main { display: flex; flex-direction: column; min-width: 0; }

    /* ---------- topbar ---------- */
    .topbar {
      display: flex; align-items: center; gap: 10px; padding: 10px 16px;
      background: var(--surface); border-bottom: 1px solid var(--line);
      position: sticky; top: 0; z-index: 6;
    }
    .brand { font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
      background: var(--surface-2); border: 1px solid var(--line); color: var(--muted);
      white-space: nowrap;
    }
    .pill.brandpill { background: var(--brand); border-color: var(--brand); color: #fff; }
    .pill.ok { background: var(--ok-soft); border-color: #bfe8ce; color: var(--ok); }
    .pill.warn { background: var(--warn-soft); border-color: #f2d3ac; color: var(--warn); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .spacer { flex: 1; }
    /* One status strip instead of a row of competing pills. */
    .status { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
    .status b { color: var(--ink); font-weight: 600; }
    .status .stat { display: inline-flex; align-items: center; gap: 6px; }
    .status .stat svg { width: 15px; height: 15px; color: var(--faint); }
    .status .sep { width: 1px; height: 16px; background: var(--line); }
    .status .warn { color: var(--warn); font-weight: 600; }
    .status .warn svg { color: var(--warn); }
    .who { display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px 4px; border-radius: 999px; }
    .avatar {
      width: 30px; height: 30px; border-radius: 50%; background: var(--brand-soft); color: var(--brand);
      display: grid; place-items: center; font-size: 12px; font-weight: 700;
    }

    /* ---------- buttons ---------- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 44px; padding: 0 16px; border-radius: var(--radius-sm);
      border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
      font-weight: 600; cursor: pointer; box-shadow: var(--shadow-sm);
    }
    .btn:hover { border-color: var(--faint); }
    .btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    .btn-primary:hover { background: var(--brand-dark); border-color: var(--brand-dark); }
    .btn-quiet { background: transparent; border-color: transparent; box-shadow: none; color: var(--muted); }
    .btn-quiet:hover { background: var(--surface-2); color: var(--ink); border-color: transparent; }
    .btn-danger { color: var(--bad); border-color: #f0c5c2; background: var(--bad-soft); }
    .btn-xl { min-height: 58px; font-size: 17px; border-radius: var(--radius); }
    .btn-block { width: 100%; }
    .btn-pay { display: flex; justify-content: space-between; width: 100%; white-space: nowrap; padding: 0 20px; }
    .btn-x { min-height: 34px; padding: 0 10px; font-size: 13px; color: var(--bad); background: transparent; border-color: transparent; box-shadow: none; }
    .btn-x:hover { background: var(--bad-soft); border-color: transparent; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    /* ---------- workspace ---------- */
    .workspace {
      display: grid; grid-template-columns: minmax(0, 1fr) 372px;
      gap: 16px; padding: 16px 16px 28px; align-items: start; flex: 1; min-height: 0;
    }
    @media (max-width: 1080px) { .workspace { grid-template-columns: 1fr; } }
    .panel {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
    }
    .panel-head {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; border-bottom: 1px solid var(--line);
    }
    .panel-title { font-size: 14px; font-weight: 700; }
    .panel-sub { font-size: 12.5px; color: var(--muted); }

    /* ---------- catalog ---------- */
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .chip {
      padding: 8px 15px; border-radius: 999px; border: 1px solid var(--line);
      background: var(--surface); color: var(--muted); font-size: 13.5px; font-weight: 600;
      cursor: pointer; white-space: nowrap;
    }
    .chip:hover { color: var(--ink); border-color: var(--line-strong); }
    .chip.active { background: var(--brand); border-color: var(--brand); color: #fff; }

    .search {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface); border: 1px solid var(--line-strong); border-radius: 999px;
      padding: 0 14px; box-shadow: var(--shadow-sm);
    }
    .search svg { width: 18px; height: 18px; color: var(--faint); }
    .search input {
      flex: 1; border: 0; outline: 0; background: transparent;
      min-height: 50px; font-size: 16px; color: var(--ink);
    }
    .hint { color: var(--muted); font-size: 12.5px; }
    .kbd-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; }
    .kbd {
      display: inline-block; min-width: 22px; text-align: center;
      border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 6px;
      padding: 2px 6px; font-size: 11.5px; font-weight: 600; color: var(--muted);
      background: linear-gradient(#fff, var(--surface-2)); box-shadow: 0 1px 0 var(--line);
    }

    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr));
      gap: 10px; margin-top: 4px;
    }
    .item-card {
      display: flex; flex-direction: column; gap: 8px; text-align: left; padding: 10px 12px 11px;
      min-height: 84px; background: var(--surface); border: 1px solid var(--line);
      border-left: 4px solid hsl(var(--h) 58% 58%); border-radius: var(--radius);
      cursor: pointer; box-shadow: var(--shadow-sm);
      transition: transform .06s ease, box-shadow .12s ease, border-color .12s ease;
    }
    .item-card:hover { transform: translateY(-1px); box-shadow: var(--shadow); border-color: var(--line-strong); }
    .item-card:active { transform: translateY(0); }
    .item-card.out { opacity: .58; border-left-color: #d8dee7; }
    .item-name {
      font-weight: 700; font-size: 13.5px; line-height: 1.28;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .item-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; }
    .item-price { font-weight: 800; font-size: 14px; white-space: nowrap; }
    .item-price.unset { color: var(--bad); font-size: 11.5px; }
    .badge-stock {
      font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
      background: var(--ok-soft); color: var(--ok); border: 1px solid #c7e9d3;
    }
    .badge-stock.low { background: var(--warn-soft); color: var(--warn); border-color: #f0d5ae; }
    .badge-stock.none { background: var(--bad-soft); color: var(--bad); border-color: #f2cdc9; }
    .empty-grid { padding: 40px 10px; text-align: center; color: var(--muted); }

    /* ---------- cart ---------- */
    .cart-panel {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow); display: flex; flex-direction: column;
      position: sticky; top: 86px; height: calc(100vh - 104px);
    }
    .cart-head {
      display: flex; align-items: center; gap: 8px; padding: 11px 14px;
      background: var(--brand-soft); border-bottom: 1px solid #cfe6fb; border-radius: var(--radius) var(--radius) 0 0;
      font-weight: 700; color: var(--brand-dark); font-size: 14px;
    }
    .cart-lines { list-style: none; margin: 0; padding: 4px 8px; overflow-y: auto; flex: 1; }
    .cart-line {
      display: grid; grid-template-columns: 1fr auto; gap: 2px 10px;
      padding: 9px 6px; border-bottom: 1px dashed var(--line);
    }
    .cart-line .name { font-weight: 600; font-size: 13.5px; grid-column: 1 / 2; }
    .cart-line .unit { display: block; font-size: 11.5px; color: var(--faint); font-weight: 400; }
    .cart-line .amount { grid-column: 2 / 3; grid-row: 1 / 2; text-align: right; font-weight: 700; font-size: 14px; }
    .cart-line .stepper { grid-column: 1 / 3; display: flex; align-items: center; gap: 6px; margin-top: 2px; }
    .cart-line.warn { background: var(--warn-soft); border-radius: 8px; }
    .chip-warn {
      display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px;
      background: var(--bad-soft); color: var(--bad); border: 1px solid #f2cdc9;
      font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
    }
    .step-btn {
      width: 40px; height: 36px; border-radius: 9px; border: 1px solid var(--line-strong);
      background: var(--surface); font-size: 17px; font-weight: 700; color: var(--ink); cursor: pointer;
    }
    .step-btn:hover { background: var(--surface-2); }
    .step-btn.del { color: var(--bad); border-color: #f0c5c2; margin-left: auto; font-size: 14px; }
    .qty-box {
      min-width: 46px; text-align: center; font-weight: 800; font-size: 15px;
      background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 7px 0;
    }
    .cart-foot { border-top: 1px solid var(--line); padding: 12px 14px 14px; }
    .totals-row {
      display: flex; align-items: baseline; justify-content: space-between;
      font-size: 13.5px; color: var(--muted); margin-bottom: 6px;
    }
    .totals-row.grand { font-size: 22px; font-weight: 800; color: var(--ink); margin: 8px 0 12px; }
    .totals-row.grand b { color: var(--brand); }
    .empty-cart { padding: 42px 18px; text-align: center; color: var(--muted); }
    .empty-cart .bag {
      width: 54px; height: 54px; margin: 0 auto 12px; border-radius: 50%;
      background: var(--surface-2); display: grid; place-items: center; color: var(--faint);
    }
    .empty-cart strong { display: block; color: var(--ink); margin-bottom: 3px; }

    /* ---------- centred cards (login, shift, payment) ---------- */
    .centred { padding: 28px 16px 48px; display: flex; justify-content: center; }
    .card {
      width: 100%; max-width: 460px; background: var(--surface);
      border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden;
    }
    .card-head { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); }
    .card-body { padding: 18px 20px 20px; }
    .card-foot { padding: 14px 20px 18px; border-top: 1px solid var(--line); background: var(--surface-2); }
    .wide-card { max-width: 660px; }

    label.field { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 12px 0 6px; }
    input.text, select.text {
      width: 100%; min-height: 50px; padding: 10px 14px; font-size: 16px;
      border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface); color: var(--ink);
    }
    input.text:focus, select.text:focus { outline: 2px solid var(--brand-soft); border-color: var(--brand); }
    input.pin-display {
      text-align: center; letter-spacing: .5em; font-size: 26px; font-weight: 800; padding-left: .5em;
    }

    /* on-screen keypad: a tablet has no keyboard */
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
    .keypad button {
      min-height: 58px; border-radius: 12px; border: 1px solid var(--line-strong);
      background: var(--surface); font-size: 20px; font-weight: 700; cursor: pointer; box-shadow: var(--shadow-sm);
    }
    .keypad button:hover { background: var(--surface-2); }
    .keypad button.ok { background: var(--brand); border-color: var(--brand); color: #fff; }
    .keypad button.grey { color: var(--muted); font-size: 16px; }

    /* ---------- payment ---------- */
    .pay-total {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 14px 16px; margin-bottom: 16px;
    }
    .pay-total .big { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
    .pay-total .side { text-align: right; }
    .pay-total .side .label { font-size: 12.5px; color: var(--muted); font-weight: 600; }
    .pay-total .side .value { font-size: 20px; font-weight: 800; color: var(--warn); }
    .pay-total .side .value.settled { color: var(--ok); }
    .methods { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    .method {
      display: flex; align-items: center; gap: 10px; padding: 13px 14px; cursor: pointer;
      border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface);
      box-shadow: var(--shadow-sm);
    }
    .method input { width: 20px; height: 20px; accent-color: var(--brand); }
    .method .name { font-weight: 700; font-size: 14.5px; }
    .method .kind { font-size: 12px; color: var(--muted); }
    .method:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); }
    .quick { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .quick button {
      padding: 11px 14px; border-radius: 999px; border: 1px solid var(--line-strong);
      background: var(--surface); font-weight: 700; font-size: 13.5px; cursor: pointer; box-shadow: var(--shadow-sm);
    }
    .quick button:hover { border-color: var(--brand); color: var(--brand); }
    .receipt-lines { list-style: none; margin: 0; padding: 0; }
    .receipt-lines li {
      display: flex; justify-content: space-between; gap: 10px; padding: 8px 0;
      border-bottom: 1px dashed var(--line); font-size: 14px;
    }
    .receipt-lines .q { color: var(--muted); font-size: 12.5px; }

    /* ---------- tables, alerts, paper ---------- */
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); font-size: 14px; }
    th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; font-weight: 700; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .alert {
      display: flex; gap: 10px; align-items: flex-start; margin: 0 16px 4px;
      padding: 12px 14px; border-radius: var(--radius); background: var(--bad-soft);
      border: 1px solid #f2cdc9; color: #8f1d18; font-weight: 600; font-size: 14px;
    }
    .alert.info { background: var(--brand-soft); border-color: #cfe6fb; color: var(--brand-dark); }
    .ok { color: var(--ok); font-weight: 700; }
    .bad { color: var(--bad); font-weight: 700; }
    pre.paper {
      background: #fdfdfb; border: 1px solid var(--line); border-radius: 10px;
      padding: 16px; font: 13px/1.4 "Cascadia Mono", Consolas, "Courier New", monospace;
      white-space: pre; overflow-x: auto; box-shadow: inset 0 1px 3px rgba(15, 23, 42, .05);
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .row > * { flex: 1; }
    .stack > * + * { margin-top: 10px; }
  </style>
</head>
<body hx-headers='{"X-Kiosbin": "till"}'>
{% block body %}{% endblock %}
<script>
  // Cart writes are fire-and-forget (the server answers 204). The cart is re-read once the burst
  // of taps settles, so however the responses interleave the cashier always sees the real cart —
  // and no tap can be lost to a swap race.
  let cartTimer = null;
  document.addEventListener("htmx:afterRequest", (evt) => {
    const path = evt.detail && evt.detail.requestConfig ? evt.detail.requestConfig.path : "";
    if (!path.startsWith("/cart/")) return;
    clearTimeout(cartTimer);
    cartTimer = setTimeout(
      () => htmx.ajax("GET", "/cart", { target: "#cart", swap: "outerHTML" }),
      50,
    );
  });
</script>
<script>
  // Live clock + how long the shift has been running: both are decoration, the server owns truth.
  document.addEventListener("DOMContentLoaded", () => {
    const clock = document.querySelector("[data-clock]");
    const shift = document.querySelector("[data-shift-opened]");
    const pad = (n) => String(n).padStart(2, "0");
    const tick = () => {
      const now = new Date();
      if (clock) clock.textContent = pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
      if (shift) {
        const started = new Date(shift.dataset.shiftOpened.replace(" ", "T"));
        const mins = Math.max(0, Math.floor((now - started) / 60000));
        shift.textContent = "{{ t.shift_active }} " + Math.floor(mins / 60) + "{{ t.hours_short }} " + (mins % 60) + "m";
      }
    };
    tick();
    setInterval(tick, 1000);
  });
</script>
</body>
</html>
