<div class="grid" id="grid">
  {% for item in items %}
  <button class="item-card{% if item.sold_out %} out{% endif %}" style="--h: {{ item.hue }}"
          hx-post="/cart/add" hx-vals='{"item_id": {{ item.id }}}' hx-swap="none"
          title="{{ item.code }}">
    <span class="item-name">{{ item.name }}</span>
    <span class="item-foot">
      <span class="item-price{% if item.no_price %} unset{% endif %}">{% if item.no_price %}{{ t.price_missing }}{% else %}{{ item.price_display }}{% endif %}</span>
      {% if item.has_availability %}
      <span class="badge-stock {{ item.stock_class }}">{% if item.sold_out %}{{ t.sold_out }}{% else %}{{ item.availability }}{% endif %}</span>
      {% endif %}
    </span>
  </button>
  {% endfor %}
  {% if items.is_empty() %}
  <div class="empty-grid">{{ t.no_search_results }}</div>
  {% endif %}
</div>
